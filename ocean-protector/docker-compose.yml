services:
  db:
    image: postgis/postgis:15-3.4
    container_name: oceanguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: oceanguard
      POSTGRES_PASSWORD: oceanguard_pass
      POSTGRES_DB: oceanguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanguard -d oceanguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  classifier:
    build:
      context: ./backend/classifier
      dockerfile: Dockerfile
    container_name: oceanguard-classifier
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/classifier:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    container_name: oceanguard-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://oceanguard:oceanguard_pass@db:5432/oceanguard_db
      CLASSIFIER_SERVICE_URL: http://classifier:8000
      CORS_ORIGIN: http://localhost:5173
      SUPABASE_URL: https://gddtcwatahvmzgbpagsc.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkZHRjd2F0YWh2bXpnYnBhZ3NjIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NTkxMDA3NiwiZXhwIjoyMTAxNDg2MDc2fQ.CPogXimWbXPX6SStuNGrXVkAEiM2NIMEZ_PSg6k16Uc
      CLOUDINARY_CLOUD_NAME: dxugxxog
      CLOUDINARY_API_KEY: "734225795962657"
      CLOUDINARY_API_SECRET: LSzRlrheez1Js45rJa2RnQlsFlk
    depends_on:
      db:
        condition: service_healthy
      classifier:
        condition: service_healthy
    volumes:
      - ./backend/api:/app
      - ./backend/database:/app/database:ro
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
        VITE_SOCKET_URL: http://localhost:4000
        VITE_DATA_MODE: api
        VITE_SUPABASE_URL: https://gddtcwatahvmzgbpagsc.supabase.co
        VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkZHRjd2F0YWh2bXpnYnBhZ3NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MTAwNzYsImV4cCI6MjEwMTQ4NjA3Nn0.8a4TgU10o6cuCFekV9Pj5CAYMKb4zWJdbvyiTsG-FBY
        CLOUDINARY_CLOUD_NAME: dxugxxog
        CLOUDINARY_API_KEY: "734225795962657"
        CLOUDINARY_API_SECRET: LSzRlrheez1Js45rJa2RnQlsFlk
    container_name: oceanguard-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
